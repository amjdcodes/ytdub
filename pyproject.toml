[project]
name = "ytdub"
version = "1.1.0"
description = "CLI لتحميل فيديوهات يوتيوب مع الدبلجة والجودة المختارة"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
dependencies = [
  "yt-dlp[default]>=2024.8.6",
  "rich>=13.7.0",
  "click>=8.1.0",
  "questionary>=2.0.0",
]

[project.scripts]
ytdub = "ytdub.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
